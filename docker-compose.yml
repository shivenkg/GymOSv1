services:
  postgres:
    image: postgres:16-alpine
    container_name: gymos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gymos_db}
      POSTGRES_USER: ${POSTGRES_USER:-gymos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gymos_secure_local_pass}
    ports:
      - "5432:5432"
    volumes:
      - gymos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gymos_user} -d ${POSTGRES_DB:-gymos_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymos-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-gymos_user}:${POSTGRES_PASSWORD:-gymos_secure_local_pass}@postgres:5432/${POSTGRES_DB:-gymos_db}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET:-gymos-local-docker-jwt-secret-replace-in-prod}
      VITE_API_URL: /api
    ports:
      - "3000:3000"

volumes:
  gymos_pgdata:
    driver: local
